spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  flyway:
    enabled: true

# jwt token configuration
jwt:
  key: ${JWT_KEY}
  access-token-expiration: 604800000 # 7 days
  refresh-token-expiration: 18144000000 # 21 days

# openai configuration
openai:
  token: ${OPENAI_API_KEY}
  organization: ${OPENAI_ORGANIZATION}

# Social Login Configuration
auth:
  google:
    ios-client-id: ${GOOGLE_IOS_CLIENT_ID}

# Cloud Configuration
cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:inout-local}
      region: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}
org:
  # Jobrunr Configuration
  jobrunr:
    background-job-server:
      enabled: true # use background job server due to limited resources on cloud
    dashboard:
      enabled: true

app:
  jobrunr:
    data-source-url: ${JOBRUNR_DB_DATASOURCE_URL:jdbc:postgresql://localhost:5432/in-out-jobrunr-local}
    data-source-username: ${JOBRUNR_DB_USERNAME:admin}
    data-source-password: ${JOBRUNR_DB_PASSWORD:inout1234}
