# Cloud Configuration
cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:inout-local} # TODO: temp, changing to gcp storage later
      region: ${AWS_REGION:ap-northeast-2} # TODO: temp, changing to gcp storage later
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}

# Social Login Configuration
auth:
  google:
    ios-client-id: ${GOOGLE_IOS_CLIENT_ID}
