# Cloud Configuration
cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:inout-local} # TODO: temp, changing to gcp storage later
      region: ${AWS_REGION:ap-northeast-2} # TODO: temp, changing to gcp storage later
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}

# Social Login Configuration
auth:
  google:
    ios-client-id: ${GOOGLE_IOS_CLIENT_ID}

org:
  # Jobrunr Configuration
  jobrunr:
    database:
      datasource: ${JOBRUNR_DB_DATASOURCE}
    background-job-server:
      enabled: true # use background job server due to limited resources on cloud
    dashboard:
      enabled: true # Enable the JobRunr dashboard on dev environment

app:
  jobrunr:
    data-source-username: ${JOBRUNR_DB_USERNAME}
    data-source-password: ${JOBRUNR_DB_PASSWORD}
