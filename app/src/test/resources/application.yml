spring:
  datasource:
    # see: https://stackoverflow.com/questions/68468851/testcontainers-sql-too-many-connections-exception
    # setting pool size in order to avoid connection pool exhaustion
    # - @SpringBootTest creates a new application context for each test class
    # - while it tries its best to reuse the same connection pool, having a @SpyBean or @MockBean will force tests to
    #   create a new application context, and thus a new connection pool (depleting the connection pool)
    # - setting the maximum pool size will prevent excessive connections from being created (thus, this is a workaround)
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: create
#    show-sql: true
#    properties:
#      hibernate:
#        jdbc:
#          time_zone: UTC
  flyway:
    enabled: false

